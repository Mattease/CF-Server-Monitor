name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 */3 * * *" # Run every 3 hours
  workflow_dispatch:

jobs:
  sync_latest_commits_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Sync with upstream via GitHub API
        id: api_sync
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting fast sync via GitHub merge-upstream API..."
          response=$(gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main 2>&1) || true
          echo "$response"
          if echo "$response" | grep -q -E "successfully merged|not behind"; then
            echo "API Sync succeeded."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "API Sync returned non-standard status, falling back to git action..."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout target repo (Fallback)
        if: steps.api_sync.outputs.synced != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes (Fallback Action)
        if: steps.api_sync.outputs.synced != 'true'
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: huilang-me/CF-Server-Monitor
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Upstream sync failed. Please check repository conflicts or PAT_TOKEN permissions."
          exit 1